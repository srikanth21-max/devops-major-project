<!DOCTYPE html>
<html>
<head>
  <title>DevOps Project</title>
</head>
<body>
  <h1>3-Tier DevOps Project</h1>
  <p id="status">Checking backend...</p>
  <p id="dbtime"></p>

  <script>
    fetch('http://localhost:5000/api/health')
      .then(res => res.json())
      .then(data => {
        document.getElementById('status').innerText = data.status;
      })
      .catch(() => {
        document.getElementById('status').innerText = 'Backend not reachable';
      });

    fetch('http://localhost:5000/api/time')
      .then(res => res.json())
      .then(data => {
        document.getElementById('dbtime').innerText = 'DB time: ' + data.dbTime;
      });
  </script>
</body>
</html>
